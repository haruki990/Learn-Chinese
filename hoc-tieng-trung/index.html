<html lang="vi">
<head>
<meta charset="utf-8">

<title>Học tiếng Trung</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--ac:#c0392b;--ac2:#2d6a4f;--bd:#e3e1d8;--bad:#b3261e;--gold:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#222220;--tx:#efeee8;--mut:#9c9a91;--ac:#e8705f;--ac2:#6cc29a;--bd:#38372f;--bad:#f2867d;--gold:#e9b44c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:660px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.top h1{font-size:19px;margin:0;flex:1;min-width:150px}
.chip{padding:5px 10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;font-size:14px;cursor:pointer;white-space:nowrap}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{flex:1;min-width:84px;padding:9px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font-size:14px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px 18px;text-align:center;margin-bottom:10px}
.han{font-size:72px;line-height:1.2;font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
.pin{font-size:26px;color:var(--ac)}
.mean{font-size:20px;margin-top:6px}
.mut{color:var(--mut);font-size:14px}
.kb-hint{text-align:center;font-size:12px;margin-top:8px}@media (hover:none){.kb-hint{display:none}}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row button,.btn{flex:1;padding:11px 8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font-size:15px}
.btn.pri,.row button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.r0{border-color:var(--bad)!important;color:var(--bad)}.r3{border-color:var(--ac2)!important;color:var(--ac2)}
.opt{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer;font-size:16px}
.kn{display:inline-block;min-width:20px;height:20px;line-height:20px;margin-right:8px;border-radius:5px;background:var(--bd);color:var(--mut);font-size:12px;text-align:center;vertical-align:middle}
.pyn{font-size:13px;color:var(--ac)}.opt.ok .pyn,.opt.no .pyn,.opt.ok .kn,.opt.no .kn{color:#fff}
.opt.ok{background:var(--ac2);color:#fff;border-color:var(--ac2)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:17px;margin-top:8px}
.sp{font-size:22px;background:none;border:none;cursor:pointer;color:var(--mut)}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac2);border-radius:99px;transition:width .3s}
.bar.g i{background:var(--gold)}
.lv{display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer;width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:14px;margin-bottom:10px;font-size:16px}
.lv b{font-size:26px;color:var(--ac);min-width:62px}
.les{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:16px}
.les .n{width:38px;height:38px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.les.done .n{background:var(--ac2);color:#fff}.les.cur{border-color:var(--ac)}.les.cur .n{background:var(--ac);color:#fff}
.les.lock{opacity:.5;cursor:not-allowed}
.les small{display:block;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--mut)}
.stat b{display:block;font-size:24px;color:var(--ac)}
.chest{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:16px;cursor:pointer}
.chest .ic{font-size:30px}.chest.ready{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}.chest.lock{opacity:.5;cursor:default}
.story p{text-align:left;margin:10px 0}
.story .hz{font-size:34px;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.idiom{background:var(--bg);border-radius:10px;padding:10px;margin-top:12px;text-align:left;font-size:15px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:left}
.ult-ov{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 45%,rgba(28,20,48,.86),rgba(4,3,10,.94));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;animation:ultIn .2s ease-out}
.ult-ov.out{opacity:0;transition:opacity .2s}.ult-ov canvas{display:block;max-width:100%}
.ult-vd{display:block;max-width:100%;border-radius:16px;box-shadow:0 0 28px rgba(255,255,255,.25)}
@keyframes ultIn{from{opacity:0}to{opacity:1}}
.ult-nm{color:#fff;text-align:center;line-height:1.25;text-shadow:0 0 12px var(--uc),0 0 3px #000}.ult-nm .han{display:block;font-size:30px;letter-spacing:4px}.ult-nm small{display:block;opacity:.85}.ult-nm b{font-size:16px}
.ult-sk{color:rgba(255,255,255,.55);font-size:12px}
.ult-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.ult-c{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 6px;border:2px solid var(--bd);border-left:5px solid var(--uc);text-align:center}
.ult-c.me{border-color:var(--uc);box-shadow:0 0 0 2px var(--uc) inset}.ult-c .ue{font-size:24px}.ult-c b{font-size:14px}.ult-c small{font-size:11px}
.hide{display:none}.ok-t{color:var(--ac2)}.bad-t{color:var(--bad)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.pills button{padding:6px 11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;font-size:13px;cursor:pointer}
.pills button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.stage{position:relative;margin:auto;border-radius:20px}
.frm{padding:5px;border-radius:20px}
.petb{position:absolute;right:-6px;bottom:-6px;font-size:40px;filter:drop-shadow(0 2px 3px #0006)}
.frm{position:relative;z-index:1}
.aur{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;z-index:0;animation:auspin 30s linear infinite,aupulse 2.6s ease-in-out infinite}
@keyframes auspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes aupulse{0%,100%{opacity:.8}50%{opacity:1}}
.peti{position:absolute;right:-22px;bottom:-16px;width:42%;z-index:3;filter:drop-shadow(0 4px 6px #0007);animation:petfloat 3s ease-in-out infinite;pointer-events:none}
@keyframes petfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.frbadge{position:absolute;left:-14px;top:-14px;z-index:3}
.bst{position:relative;display:block;flex:none}
.bst>img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;max-width:none}
.bst>.bau{width:140%;opacity:.9;animation:auspin 30s linear infinite}
.item .pv.pvi{object-fit:contain;padding:2px;background:radial-gradient(#2b2440,#15121f)}
@media (prefers-reduced-motion:reduce){.aur,.peti,.bst>.bau{animation:none}}
img[src*="chars/"]{background:radial-gradient(circle at 50% 42%,#5a5288 0%,#2a2640 70%,#1d1a2c 100%)}
.ar img[src*="chars/"]{background:none}
/* nhân vật trong trận boss: không khung, lật quay về phía boss (đặt cả ở đây để không phụ thuộc rpg.js bị cache) */
#ar .ar-p .ar-i{border:0;box-shadow:none;border-radius:0;overflow:visible;background:none}
#ar .ar-p .ar-i img{object-fit:contain;transform:scaleX(-1);background:none}
@keyframes glow{0%,100%{box-shadow:0 0 10px 2px var(--gc)}50%{box-shadow:0 0 30px 9px var(--gc)}}
.gi{display:inline-block;border-radius:10px;padding:2px;flex:none}
.item{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;text-align:left}
.item .pv{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;border:1px solid var(--bd)}
.item .nm{flex:1}.item .nm small{display:block;color:var(--mut)}
.item button{padding:8px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap}
.item button.buy{background:var(--gold);color:#fff;border-color:var(--gold)}
.item button.use{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.item button:disabled{opacity:.45;cursor:not-allowed}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;margin:3px}
.sw.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.realm{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--bd);font-size:15px;text-align:left}
.realm.cur{background:var(--bg);font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;max-width:92vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
#toast.on{opacity:1}

  }
});

const KEY = 'zh_app_v1', DAY = 86400000;
const today = () => new Date().toISOString().slice(0, 10);
let S;
function parseSeed() {
  let lvl = 1, i = 0; const out = [];
  SEED.trim().split('\n').forEach(l => {
    l = l.trim(); if (!l) return;
    if (l[0] === '#') { lvl = +l.slice(1); return; }
    const [h, p, m] = l.split('|');
    out.push({ id: 's' + i++, h, p, m, l: lvl });
  });
  return out;
}
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !S.words) S = { words: [], cards: {}, log: {} };
  S.cards = S.cards || {}; S.log = S.log || {}; S.lessons = S.lessons || {};
  S.xp = S.xp || 0; S.bestStreak = S.bestStreak || 0; S.opened = S.opened || []; S.deleted = S.deleted || [];
  if (!('level' in S)) S.level = null;
  S.hero = S.hero || { name: 'Đạo hữu' };
  S.hero.char = S.hero.char || 'kiem';
  S.ls = S.ls || 0; S.inv = S.inv || {}; S.equip = S.equip || {};
  // Đồ cũ (áo, kiếm, nền, mũ của bản vẽ SVG) đã bỏ: hoàn lại linh thạch
  const OLD = { robe_azure: 80, robe_purple: 160, robe_gold: 320, robe_red: 450, robe_black: 600, sw_wood: 40, sw_green: 140, sw_purple: 380, sw_fire: 600, bg_valley: 70, bg_snow: 130, bg_cloud: 200, bg_night: 300, hd_band: 50, hd_jade: 150, hd_gold: 320 };
  Object.keys(OLD).forEach(k => { if (S.inv[k]) { S.ls += OLD[k]; S.refunded = (S.refunded || 0) + OLD[k]; delete S.inv[k]; } });
  ['robe', 'weapon', 'bg', 'head'].forEach(k => delete S.equip[k]);
  S.perfect = S.perfect || {}; S.freezes = S.freezes || 0; S.frozen = S.frozen || {};
  const byId = {}; S.words.forEach(w => byId[w.id] = w);
  parseSeed().forEach(w => {
    if (byId[w.id]) byId[w.id].l = w.l;
    else if (!S.deleted.includes(w.id)) S.words.push(w);
  });
  S.words.forEach(w => { if (!w.l) w.l = S.level || 1; });
  save();
}
function save() { if (window.__noSave) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
load();

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ü/g, 'u').replace(/v/g, 'u').replace(/[\d\s'’\-]/g, '').toLowerCase();
let _au = null;
function speak(w) {
  const t = w.h;
  if (/^s\d+$/.test(w.id)) {
    const src = (window.AUDIO && window.AUDIO[w.id]) || ('audio/' + w.id + '.mp3');
    if (_au) _au.pause();
    _au = new Audio(src);
    _au.play().catch(err => { console.warn('Audio lỗi:', err); speakTTS(t); });

function speakTTS(t) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'zh-CN'; u.rate = 0.85;

  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 4200); }
const dstr = t => new Date(t).toISOString().slice(0, 10);
function streakEnding(t) {
  let n = 0;
  for (let g = 0; g < 4000; g++, t -= DAY) {
    const d = dstr(t);
    if ((S.log[d] || 0) >= GOAL) n++;
    else if (!S.frozen[d]) break;
  }
  return n;
}
function streak() {
  const t = Date.now(), d = dstr(t);
  return streakEnding((S.log[d] || 0) >= GOAL || S.frozen[d] ? t : t - DAY);
}
// Hộ Chuỗi Phù: tự dùng để giữ chuỗi nếu hôm qua bỏ lỡ
function applyFreeze() {
  const y = dstr(Date.now() - DAY);
  if (S.freezes > 0 && (S.log[y] || 0) < GOAL && !S.frozen[y] && streakEnding(Date.now() - 2 * DAY) > 0) {
    S.freezes--; S.frozen[y] = true; save();
    toast('🧿 Hộ Chuỗi Phù đã giữ chuỗi cho ngày hôm qua!');
  }
}
function logStudy() {
  const d = today(), was = S.log[d] || 0;
  S.log[d] = was + 1;
  if (was + 1 === GOAL) {
    const st = streak(), prev = S.bestStreak;
    if (st > S.bestStreak) S.bestStreak = st;
    const gg = lsGain(10); S.ls += gg;
    let msg = '🎯 Đạt mục tiêu ngày! Chuỗi ' + st + ' ngày 🔥 · +' + gg + ' 💎';
    if (MILESTONES.includes(st) && st > prev) msg += ' · 🎁 Có rương mới ở tab Thưởng!';
    toast(msg);
  }
  save(); header();
}

const ST9 = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(i => 'Tầng ' + i);
// c = tu vi cần cho MỖI tầng (9 tầng mỗi đại cảnh giới). Qua tầng 9 phải độ kiếp mới sang cảnh giới mới.
const REALMS = [

// Mỗi cảnh giới gắn với 1 trình độ HSK: 2 cảnh giới cho mỗi HSK (cảnh giới đầu kiểm tra nửa đầu, cảnh giới sau kiểm tra toàn bộ).
// Mỗi cảnh giới cần đúng GCFG.daysPerRealm ngày học đều: mỗi ngày tối đa GCFG.xpDayCap tu vi (xem addXP), nên không thể lên nhanh hơn.
const RLV = [1, 1, 2, 2, 3, 3, 4, 4, 5];
REALMS.forEach((r, i) => {
  r.st = ST9; r.hsk = RLV[i];
  const pair = RLV.filter(x => x === r.hsk).length, idx = RLV.slice(0, i).filter(x => x === r.hsk).length;
  r.scope = pair === 1 || idx === 1 ? 'full' : 'half';
  r.c = Math.round(GCFG.xpDayCap * GCFG.daysPerRealm / 9 / 5) * 5; // tu vi mỗi tầng
});
const FLAT = [], REND = []; let TOTAL = 0;
REALMS.forEach((r, ri) => { r.st.forEach((s, si) => { FLAT.push({ i: FLAT.length, ri, si, cost: r.c, start: TOTAL }); TOTAL += r.c; }); REND[ri] = TOTAL; });
function realmInfo(xp) {
  if (xp >= TOTAL) return { flat: FLAT.length, ri: REALMS.length, name: 'Phi Thăng', h: '飞升', p: 'fēishēng', into: 1, need: 1, max: true };
  const f = FLAT.find(f => xp < f.start + f.cost), r = REALMS[f.ri];
  return { flat: f.i, ri: f.ri, name: r.n + ' ' + r.st[f.si], h: r.h, p: r.p, into: xp - f.start, need: f.cost, max: false };
}
function addXP(n) {
  if (typeof gExpBonus === 'function') n = Math.round(n * (1 + gExpBonus() / 100));
  const dd = today(); if (S.xpDay !== dd) { S.xpDay = dd; S.xpToday = 0; S.xpCapToast = false; }
  const room = gXpRoom();
  if (n > room) { n = room; if (!S.xpCapToast) { S.xpCapToast = true; toast('⏳ Đã đạt giới hạn tu vi hôm nay (' + GCFG.xpDayCap + '). Quay lại ngày mai để tiếp tục tu luyện!'); } }
  S.xpToday = (S.xpToday || 0) + n;
  if (n <= 0) { save(); header(); return; }
  const a = realmInfo(S.xp); let nx = S.xp + n, capped = false;
  if (a.ri < REALMS.length && !(S.bt || {})[a.ri] && nx >= REND[a.ri]) { nx = REND[a.ri] - 1; capped = true; }
  S.xp = nx; const b = realmInfo(S.xp);
  if (b.flat > a.flat) {
    const big = b.ri > a.ri, gift = lsGain(big ? 60 * b.ri : 5);
    S.ls += gift;
    toast((big ? '⚡ ĐỘT PHÁ CẢNH GIỚI! ' : '✨ Đột phá! ') + b.h + ' ' + b.name + ' · +' + gift + ' 💎');
  } else if (capped && a.into < a.need - 1) toast('⚡ Đã đạt đỉnh ' + a.h + ' ' + a.name + '! Vào tab Tu tiên để độ kiếp.');
  save(); header();
}

function rate(id, q) {
  const c = S.cards[id] || { ease: 2.5, interval: 0, reps: 0, due: 0 };
  if (q === 0) { c.reps = 0; c.interval = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = Date.now() + 60000; }
  else {
    if (q === 1) { c.interval = Math.max(1, Math.round(c.interval * 1.2)); c.ease = Math.max(1.3, c.ease - 0.15); }
    else if (q === 2) { c.interval = c.reps === 0 ? 1 : c.reps === 1 ? 3 : Math.round(c.interval * c.ease); }
    else { c.interval = c.reps === 0 ? 3 : Math.round(Math.max(c.interval, 1) * c.ease * 1.3); c.ease += 0.15; }
    c.reps++; c.due = Date.now() + c.interval * DAY;
  }
  S.cards[id] = c; logStudy();
}

// ================= Bài học: giới thiệu từ → kiểm tra =================
function vLesson(L, k) {
  const ws = lessonsOf(L)[k]; let j = 0;
  view.onclick = null;
  const intro = () => {
    const w = ws[j];
    view.innerHTML = `<div class="mut">Bài ${k + 1} · Từ mới ${j + 1}/${ws.length}</div><div class="bar"><i style="width:${j / ws.length * 100}%"></i></div>
    <div class="card"><div class="han">${esc(w.h)}</div><button class="sp" id="spk">🔊</button><div class="pin">${esc(w.p)}</div><div class="mean">${esc(w.m)}</div></div>
    <div class="row"><button id="bk" ${j ? '' : 'disabled'}>← Trước</button><button class="pri" id="nx">${j < ws.length - 1 ? 'Tiếp →' : 'Làm bài kiểm tra →'}</button></div>`;
    $('#spk').onclick = () => speak(w); speak(w);
    $('#bk').onclick = () => { j--; intro(); };
    $('#nx').onclick = () => { if (j < ws.length - 1) { j++; intro(); } else runQuiz({ words: ws, pool: lw(L), onDone: finish }); };
  };
  const finish = (ok, total) => {
    const key = lkey(L, k), sc = ok / total, pass = sc >= PASS, first = !passed(L, k), perfect = ok === total;
    if (sc > (S.lessons[key] || 0)) S.lessons[key] = sc;
    let bx = 0, bl = 0; const parts = [];
    if (pass) {
      ws.forEach(w => { if (!S.cards[w.id]) S.cards[w.id] = { ease: 2.5, interval: 1, reps: 1, due: Date.now() + DAY }; });
      if (first) { bx += 20; bl += lsGain(10); parts.push('qua bài +20 tu vi +' + lsGain(10) + ' 💎'); }
    }
    if (perfect) {
      if (!S.perfect[key]) { S.perfect[key] = true; bx += 30; bl += lsGain(25); parts.push('✨ HOÀN HẢO lần đầu +30 tu vi +' + lsGain(25) + ' 💎'); }
      else { bx += 10; bl += lsGain(5); parts.push('hoàn hảo +10 tu vi +' + lsGain(5) + ' 💎'); }
    }
    S.ls += bl; save(); if (bx) addXP(bx); else header();
    const hasNext = k + 1 < lessonsOf(L).length;
    view.innerHTML = `<div class="card"><div class="han" style="font-size:56px">${perfect ? '🌟' : pass ? '🎉' : '💪'}</div>
      <div class="mean"><b>${ok}/${total}</b> câu đúng (${Math.round(sc * 100)}%)</div>
      <p class="mut">${pass ? 'Bạn đã qua bài ' + (k + 1) + (first ? ', các từ đã thêm vào mục Ôn tập.' : '.') : 'Cần đạt ít nhất ' + PASS * 100 + '% để qua bài. Thử lại nhé!'}</p>
      ${parts.length ? '<p><b>Thưởng:</b> ' + parts.join(' · ') + '</p>' : ''}
      <p class="mut">Mỗi câu đúng: +10 tu vi, +${lsGain(1)} 💎</p></div>
      <div class="row"><button id="again">Làm lại</button>${pass && hasNext ? '<button class="pri" id="nxl">Bài tiếp theo →</button>' : ''}<button id="home">Về danh sách bài</button></div>`;
    $('#again').onclick = () => vLesson(L, k);
    $('#home').onclick = () => go('home');
    const n = $('#nxl'); if (n) n.onclick = () => vLesson(L, k + 1);
  };
  intro();
}

// ================= Bộ câu hỏi trắc nghiệm dùng chung =================
function runQuiz(o) {
  const items = shuffle(o.words); let i = 0, ok = 0;
  view.onclick = null;
  const next = () => {
    if (i >= items.length) return o.onDone(ok, items.length);
    const w = items[i], type = pick(['h2m', 'm2h', 'listen']);
    let ds = shuffle(o.pool.filter(x => x.id !== w.id && x.m !== w.m && x.h !== w.h && x.p !== w.p)).slice(0, 3);
    if (ds.length < 3) ds = shuffle(o.pool.filter(x => x.id !== w.id)).slice(0, 3);
    const opts = shuffle([w].concat(ds));
    const lab = x => type === 'h2m' ? esc(x.m) : `<span style="font-size:24px">${esc(x.h)}</span><br><span class="pyn">${esc(x.p)}</span>`;
    const q = type === 'h2m' ? `<div class="mut">Chọn nghĩa đúng</div><div class="han">${esc(w.h)}</div><div class="pin">${esc(w.p)}</div><button class="sp" id="spk">🔊</button>`
      : type === 'm2h' ? `<div class="mut">Chọn chữ Hán đúng</div><div class="mean" style="font-size:28px;margin:14px 0">${esc(w.m)}</div>`
      : `<div class="mut">Nghe và chọn chữ Hán đúng</div><button class="sp" id="spk" style="font-size:54px">🔊</button>`;
    view.innerHTML = `<div class="mut" style="text-align:right">${gComboTxt()} · ${i + 1}/${items.length}</div><div class="bar"><i style="width:${i / items.length * 100}%"></i></div>
      <div class="card">${q}<div id="opts">${opts.map((x, n) => `<button class="opt" data-id="${x.id}"><span class="kn">${n + 1}</span>${lab(x)}</button>`).join('')}</div><div id="fb" style="margin-top:10px;min-height:24px"></div></div>
      <div class="row"><button class="pri hide" id="nx">${i + 1 < items.length ? 'Câu tiếp →' : 'Xem kết quả'}</button></div>`;
    const sp = $('#spk'); if (sp) sp.onclick = () => speak(w);
    if (type !== 'm2h') speak(w);
    let done = false;
    $('#opts').onclick = e => {
      const b = e.target.closest('.opt'); if (!b || done) return; done = true;
      const right = b.dataset.id === w.id;
      b.classList.add(right ? 'ok' : 'no');
      if (!right) $(`.opt[data-id="${w.id}"]`).classList.add('ok');
      if (right) { ok++; if (!o.free || gPracOK()) { S.ls += lsGain(1); addXP(10); } }
      const dr = rpgOnAnswer(right);
      $('#fb').innerHTML = (dr ? gDropHTML(dr) : '') + `${right ? '<span class="ok-t">✓ Đúng!</span>' : '<span class="bad-t">✗ Chưa đúng.</span>'} <b>${esc(w.h)}</b> ${esc(w.p)} · ${esc(w.m)}`;
      if (type === 'm2h') speak(w);
      logStudy();
      $('#nx').classList.remove('hide');
    };
    $('#nx').onclick = () => { i++; next(); };
  };
  next();
}
// Bộ gõ pinyin dùng chung
function runType(o) {
  const items = shuffle(o.words); let i = 0, ok = 0;
  view.onclick = null;
  const next = () => {
    if (i >= items.length) return o.onDone(ok, items.length);
    const w = items[i];
    view.innerHTML = `<div class="mut" style="text-align:right">${gComboTxt()} · ${i + 1}/${items.length}</div><div class="bar"><i style="width:${i / items.length * 100}%"></i></div>
      <div class="card"><div class="mut">Gõ pinyin (không cần dấu, ví dụ: ni hao)</div><div class="han">${esc(w.h)}</div><div class="mean">${esc(w.m)}</div>
      <button class="sp" id="spk">🔊</button><input id="ans" autocomplete="off" autocapitalize="none" placeholder="pinyin..."><div id="fb" style="margin-top:10px;min-height:28px"></div></div>
      <div class="row"><button class="pri" id="go">Kiểm tra</button></div>`;
    $('#spk').onclick = () => speak(w);
    const inp = $('#ans'); inp.focus();
    let done = false;
    const check = () => {
      if (done) { i++; return next(); }
      done = true;
      const right = norm(inp.value) === norm(w.p);
      if (right) { ok++; if (!o.free || gPracOK()) { S.ls += lsGain(1); addXP(10); } }
      const dr = rpgOnAnswer(right);
      $('#fb').innerHTML = (right ? '<span class="ok-t">✓ Đúng!</span> ' : '<span class="bad-t">✗ Sai.</span> ') + `<b>${esc(w.p)}</b>` + (dr ? gDropHTML(dr) : '');
      $('#go').textContent = i + 1 < items.length ? 'Câu tiếp →' : 'Xem kết quả';
      speak(w); logStudy();
    };
    $('#go').onclick = check;
    inp.onkeydown = e => { if (e.key === 'Enter') check(); };
  };
  next();
}
function resultScreen(ok, total, again, label) {

}

// ================= Trắc nghiệm / Gõ pinyin tự do (theo cấp đã chọn) =================
const QUIZ_N = 20, TYPE_N = 15;
function vQuizFree() {
  const pool = lw(S.level);
  if (pool.length < 4) { view.innerHTML = '<div class="card">Cấp này chưa đủ từ.</div>'; return; }
  const start = () => runQuiz({ free: true, words: shuffle(pool).slice(0, QUIZ_N), pool, onDone: (ok, t) => resultScreen(ok, t, start, 'Chơi tiếp ' + QUIZ_N + ' câu') });
  start();
}
function vTypeFree() {
  const pool = lw(S.level);
  if (!pool.length) { view.innerHTML = '<div class="card">Cấp này chưa có từ.</div>'; return; }
  const start = () => runType({ free: true, words: shuffle(pool).slice(0, TYPE_N), onDone: (ok, t) => resultScreen(ok, t, start, 'Chơi tiếp ' + TYPE_N + ' từ') });
  start();
}

// ================= Ôn tập SRS =================
let queue = [], cur = null, shown = false, rvHist = [];
function vReview() {
  queue = shuffle(S.words.filter(w => S.cards[w.id] && S.cards[w.id].due <= Date.now()));
  rvHist = [];
  nextCard();
}
// Chấm điểm thẻ hiện tại rồi sang thẻ kế (nhớ lại để phím ← hoàn tác được)
function rvRate(q) {
  const old = S.cards[cur.id] ? Object.assign({}, S.cards[cur.id]) : null;
  rate(cur.id, q);
  const again = q === 0;
  if (again) queue.splice(Math.min(3, queue.length), 0, cur);
  rvHist.push({ w: cur, old, again, day: today() });
  if (rvHist.length > 200) rvHist.shift();
  nextCard();
}
// Bỏ qua thẻ chưa chấm: đưa xuống cuối hàng đợi
function rvSkip() {
  queue.push(cur);
  rvHist.push({ w: cur, skip: true });
  nextCard();
}
// Quay lại thẻ trước: hoàn tác lượt chấm của thẻ đó
function rvBack() {
  const h = rvHist.pop(); if (!h) { toast('Đây là thẻ đầu tiên.'); return; }
  if (cur) queue.unshift(cur);
  const i = queue.lastIndexOf(h.w);
  if ((h.skip || h.again) && i >= 0) queue.splice(i, 1);
  if (!h.skip) {
    if (h.old) S.cards[h.w.id] = h.old; else delete S.cards[h.w.id];
    if (h.day === today() && S.log[h.day] > 0 && S.log[h.day] !== GOAL) S.log[h.day]--;
    if (typeof save === 'function') save();
  }
  cur = h.w; shown = !h.skip; drawCard();
}
// Phím tắt ôn tập: Enter/Space hiện nghĩa (đã hiện thì = Tốt), → từ kế, ← từ trước, 1–4 chấm Lại/Khó/Tốt/Dễ
document.addEventListener('keydown', e => {
  if (tab !== 'review' || e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target; if (tg && (/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName) || tg.isContentEditable)) return;
  if (document.querySelector('.ult-ov, .modal:not(.hide)')) return;
  const k = e.key;
  if (k === 'ArrowLeft') { if (!rvHist.length && !cur) return; e.preventDefault(); return rvBack(); }
  if (!cur || !$('#rv-card')) return;
  if (k === 'Enter' || k === ' ') { e.preventDefault(); if (!shown) { shown = true; speak(cur); drawCard(); } else rvRate(2); }
  else if (k === 'ArrowRight') { e.preventDefault(); if (shown) rvRate(2); else rvSkip(); }
  else if (shown && /^[1-4]$/.test(k)) { e.preventDefault(); rvRate(+k - 1); }
});
function nextCard() {
  if (!queue.length) {
    cur = null;
    const total = Object.keys(S.cards).length;
    view.innerHTML = `<div class="card"><div class="han">🎉</div><div class="mean">Hết thẻ cần ôn!</div><p class="mut">${total ? 'Bạn có ' + total + ' từ trong bộ ôn tập. Quay lại sau để ôn tiếp.' : 'Hãy qua bài kiểm tra ở tab Học, các từ sẽ tự thêm vào đây.'}</p>${rvHist.length ? '<p class="mut">⌨️ Nhấn ← để xem lại từ trước.</p>' : ''}</div>`;
    return;
  }
  cur = queue.shift(); shown = false; drawCard();
}
function drawCard() {
  const w = cur;
  view.innerHTML = `<div class="card" id="rv-card"><div class="mut">Ôn tập · còn ${queue.length} thẻ</div>
    <div class="han">${esc(w.h)}</div><button class="sp" id="spk">🔊</button>
    <div id="back" class="${shown ? '' : 'hide'}"><div class="pin">${esc(w.p)}</div><div class="mean">${esc(w.m)}</div></div></div><div class="row" id="ctrl"></div>
    <p class="mut kb-hint">⌨️ ${shown ? '1 Lại · 2 Khó · 3 Tốt · 4 Dễ · Enter/→ = Tốt' : 'Enter hiện nghĩa · → bỏ qua'}${rvHist.length ? ' · ← từ trước' : ''}</p>`;
  $('#spk').onclick = () => speak(w);
  const ctrl = $('#ctrl');
  if (!shown) {
    ctrl.innerHTML = '<button class="pri" id="show">Hiện đáp án</button>';
    $('#show').onclick = () => { shown = true; speak(w); drawCard(); };
  } else {
    ctrl.innerHTML = '<button class="r0" data-q="0">Lại</button><button data-q="1">Khó</button><button data-q="2">Tốt</button><button class="r3" data-q="3">Dễ</button>';
    ctrl.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      rvRate(+b.dataset.q);
    };
  }
}

  ${S.words.map(w => `<tr><td>${w.l}</td><td style="font-size:20px">${esc(w.h)}</td><td>${esc(w.p)}</td><td>${esc(w.m)}</td><td><button class="sp" data-del="${w.id}" title="Xóa">✕</button></td></tr>`).join('')}</table>
  <div class="row"><button id="bk-ex">⬇ Xuất sao lưu tiến độ</button><button id="bk-im">⬆ Nhập sao lưu</button><button id="rs">Xóa toàn bộ tiến độ</button></div><input type="file" id="bk-file" accept="application/json" class="hide">`;
  $('#add').onclick = () => {
    const h = $('#nh').value.trim(), p = $('#np').value.trim(), m = $('#nm').value.trim();
    if (!h || !p || !m) return toast('Điền đủ 3 ô.');
    S.words.push({ id: 'c' + Date.now(), h, p, m, l: L }); save(); vWords();
  };
  $('#bk-ex').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(Object.assign({}, S, { __slots: slotsLoad() }))], { type: 'application/json' })); a.download = 'tien-do-hoc-tieng-trung.json'; a.click(); };
  $('#bk-im').onclick = () => $('#bk-file').click();
  $('#bk-file').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(txt => { try { const d = JSON.parse(txt); if (!d || !d.words) throw 0; if (!confirm('Nhập sao lưu sẽ GHI ĐÈ toàn bộ tiến độ hiện tại. Tiếp tục?')) return; if (d.__slots) { window.__noSave = true; localStorage.setItem(SLOTKEY, JSON.stringify(d.__slots)); delete d.__slots; } window.__noSave = true; localStorage.setItem(KEY, JSON.stringify(d)); location.reload(); } catch (err) { toast('File sao lưu không hợp lệ.'); } }); };
  $('#rs').onclick = () => { if (confirm('Xóa toàn bộ tiến độ học, XP, chuỗi và phần thưởng? Không thể hoàn tác.')) { S.cards = {}; S.log = {}; S.lessons = {}; S.xp = 0; S.bestStreak = 0; S.opened = []; S.ls = 0; S.inv = {}; S.equip = {}; S.perfect = {}; S.freezes = 0; S.frozen = {}; S.bag = []; S.eq = {}; S.cores = 0; S.combo = 0; S.week = null; S.hist = []; S.beast = []; S.nextBattle = 0; S.bt = {}; S.rpgStarter = false; S.shop = { d: '', sold: [] }; rpgInit(); save(); go('home'); } };
  view.onclick = e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    if (!confirm('Xóa từ này?')) return;
    const id = b.dataset.del; S.words = S.words.filter(w => w.id !== id); delete S.cards[id]; if (!S.deleted.includes(id)) S.deleted.push(id); save(); vWords();
  };
}

// ================= Nhân vật tu tiên & cửa hàng =================
// Nhân vật = ảnh chibi (avatars-data.js, sinh bởi tools/slice_avatars.py)
const META = window.AVATAR_META || [];
const CPRICE = { kiem: 0, hoa: 0, thuy: 0, moc: 0, dia: 120, phong: 120, loi: 120, doc: 120, kimcuong: 120, bang: 220, quang: 220, dan: 220, khi: 220, nho: 220, hoa2: 220, thu: 350, am: 350, co: 350, tran: 350, hon: 500, khong: 500, thoi: 500 };
const ITEMS = META.map(m => ({ id: m.id, cat: 'char', name: m.name, kind: m.kind, skill: m.skill, price: CPRICE[m.id] ?? 220 })).concat([

  { id: 'fr_wood', cat: 'frame', name: 'Khung gỗ đàn', price: 40, css: 'linear-gradient(135deg,#b88a5a,#7a5532)', c: '#b88a5a', img: 'items/fr_wood.webp', hole: 0.591, st: { luck: 1 } },
  { id: 'fr_jade', cat: 'frame', name: 'Khung ngọc bích', price: 120, css: 'linear-gradient(135deg,#9ff5d6,#2f9e7a,#9ff5d6)', c: '#4fd1a5', img: 'items/fr_jade.webp', hole: 0.548, st: { luck: 2, expb: 1 } },
  { id: 'fr_gold', cat: 'frame', name: 'Khung kim sắc', price: 260, css: 'linear-gradient(135deg,#ffe28a,#c9962b,#ffe28a)', c: '#e0b84f', img: 'items/fr_gold.webp', hole: 0.574, st: { luck: 3, expb: 2 } },
  { id: 'fr_purple', cat: 'frame', name: 'Khung tử điện', price: 400, css: 'linear-gradient(135deg,#e0b8ff,#6a3fc4,#e0b8ff)', c: '#9a6fe0', img: 'items/fr_purple.webp', hole: 0.55, st: { luck: 4, expb: 3 } },
  { id: 'fr_dragon', cat: 'frame', name: 'Khung long văn', price: 650, css: 'linear-gradient(135deg,#ffd27a,#d0402f,#ffd27a,#d0402f)', c: '#d0402f', img: 'items/fr_dragon.webp', hole: 0.527, st: { luck: 5, expb: 4, crit: 1 } },
  { id: 'pet_turtle', cat: 'pet', name: 'Linh quy', price: 90, e: '🐢', img: 'items/pet_turtle.webp', st: { hp: 12, def: 20 } },
  { id: 'pet_fox', cat: 'pet', name: 'Tiểu hồ ly', price: 160, e: '🦊', img: 'items/pet_fox.webp', st: { atk: 6, crit: 3 } },
  { id: 'pet_crane', cat: 'pet', name: 'Tiên hạc', price: 260, e: '🦢', img: 'items/pet_crane.webp', st: { spd: 20, hit: 4, expb: 5 } },
  { id: 'pet_tiger', cat: 'pet', name: 'Bạch hổ con', price: 400, e: '🐯', img: 'items/pet_tiger.webp', st: { atk: 12, crit: 4 } },
  { id: 'pet_dragon', cat: 'pet', name: 'Tiểu thanh long', price: 700, e: '🐉', img: 'items/pet_dragon.webp', st: { hp: 15, atk: 15, def: 15, crit: 5, expb: 8 } },
  { id: 'au_cyan', cat: 'aura', name: 'Linh quang', price: 120, c: '#5ad1ff', img: 'items/au_cyan.webp', st: { expb: 2 } },
  { id: 'au_gold', cat: 'aura', name: 'Kim quang', price: 260, c: '#ffd24d', img: 'items/au_gold.webp', st: { expb: 3, luck: 2 } },
  { id: 'au_purple', cat: 'aura', name: 'Tử khí đông lai', price: 420, c: '#b57bff', img: 'items/au_purple.webp', st: { expb: 4, luck: 3, hit: 2 } },
  { id: 'au_red', cat: 'aura', name: 'Xích viêm', price: 560, c: '#ff6a3d', img: 'items/au_red.webp', st: { expb: 5, luck: 3, crit: 2 } },
  { id: 'pill_s', cat: 'use', kind: 'pill', name: 'Tụ Khí Đan', price: 25, xp: 30, e: '💊', d: '+30 tu vi (tính vào giới hạn ngày)' },
  { id: 'pill_m', cat: 'use', kind: 'pill', name: 'Trúc Cơ Đan', price: 80, xp: 100, e: '🟣', d: '+100 tu vi (tính vào giới hạn ngày)' },
  { id: 'pill_l', cat: 'use', kind: 'pill', name: 'Kim Đan', price: 250, xp: 250, e: '🔶', d: '+250 tu vi (tính vào giới hạn ngày)' },
  { id: 'charm', cat: 'use', kind: 'charm', name: 'Hộ Chuỗi Phù', price: 100, e: '🧿', d: 'Tự giữ chuỗi nếu lỡ 1 ngày (giữ tối đa 2)' }
]);
const CATS = [['char', 'Nhân vật'], ['title', 'Danh hiệu'], ['frame', 'Khung'], ['aura', 'Hào quang'], ['pet', 'Linh thú'], ['use', 'Đan dược & Phù']];
const itemOf = id => ITEMS.find(i => i.id === id);
// Khung / hào quang / linh thú đang mang cộng chỉ số (áp trong gStats ở rpg.js). hp/atk/def/spd tính %, crit/hit/luck/expb cộng thẳng.
const GCOS_ST = ['frame', 'aura', 'pet'];
const GPET_PCT = { hp: 1, atk: 1, def: 1, spd: 1 };
const petStTxt = it => it && it.st ? Object.entries(it.st).map(([k, v]) => (GPET_PCT[k] ? GSTATN[k] + ' +' + v + '%' : GSTATN[k].replace('%', '') + ' +' + v + (k === 'hit' || k === 'luck' ? '' : '%'))).join(' · ') : '';
const owned = it => it.price === 0 || !!S.inv[it.id];
const single = cat => cat === 'char' || cat === 'title'; // luôn có đúng 1 món được chọn
const isOn = it => it.cat === 'char' ? (S.hero.char || 'kiem') === it.id : it.cat === 'title' ? (S.equip.title || 'tt_0') === it.id : S.equip[it.cat] === it.id;
let shopCat = 'char';
// Ảnh nhân vật chibi nền trong suốt (quay mặt sang phải): chars/<id>_card.webp (toàn thân) và chars/<id>_bust.webp (chân dung).
// Thiếu file thì tự đổi về ảnh cũ nhúng trong avatars-data.js (xem bắt lỗi ảnh ngay dưới).
const charImg = (id, kind) => (kind === 'card' || kind === 'bust') ? 'chars/' + id + '_' + kind + '.webp' : (((window.AVATARS || {})[id] || {})[kind] || ('avatars/' + id + '_' + kind + '.webp'));
document.addEventListener('error', e => {
  const t = e.target, m = t && t.tagName === 'IMG' && /chars\/(\w+)_(card|bust)\.webp/.exec(t.src || '');
  if (!m) return; const alt = ((window.AVATARS || {})[m[1]] || {})[m[2]] || ('avatars/' + m[1] + '_' + m[2] + '.webp'); if (t.src !== alt) t.src = alt;
}, true);

function heroCard(w) {
  const fr = itemOf(S.equip.frame), au = itemOf(S.equip.aura), pet = itemOf(S.equip.pet), id = S.hero.char || 'kiem';
  const glow = au && !au.img ? '--gc:' + au.c + ';animation:glow 2.6s ease-in-out infinite;' : '';
  return `<div class="stage" style="width:${w}px;${glow}">
    ${au && au.img ? `<img class="aur" src="${au.img}" alt="">` : ''}
    <div class="frm" style="background:${fr ? fr.css : 'var(--bd)'}"><img src="${charImg(id, 'card')}" alt="Nhân vật" style="width:100%;display:block;border-radius:13px"></div>
    ${fr && fr.img ? `<span class="frbadge">${bustImg(Math.round(w * .3), true)}</span>` : ''}
    ${pet ? (pet.img ? `<img class="peti" src="${pet.img}" alt="${esc(pet.name)}">` : `<span class="petb">${pet.e}</span>`) : ''}</div>`;
}
// Ảnh đại diện tròn: khung (PNG nền trong) phủ lên, hào quang xoay phía sau. Giữ nguyên kích thước ô px.
function bustImg(px, noAura) {
  const fr = itemOf(S.equip.frame), au = noAura ? null : itemOf(S.equip.aura), src = charImg(S.hero.char || 'kiem', 'bust');
  if (!(fr && fr.img) && !(au && au.img)) return `<img src="${src}" alt="" style="width:${px}px;height:${px}px;border-radius:50%;object-fit:cover;display:block;border:3px solid ${fr ? fr.c : 'var(--bd)'}">`;
  const F = Math.round(px * 1.1), b = fr && fr.img ? Math.round(F * fr.hole * 1.04) : px;
  return `<span class="bst" style="width:${px}px;height:${px}px">${au && au.img ? `<img class="bau" src="${au.img}" alt="">` : ''}<img src="${src}" alt="" style="width:${b}px;height:${b}px;border-radius:50%;object-fit:cover;${fr && fr.img ? '' : 'border:3px solid ' + (fr ? fr.c : 'var(--bd)')}">${fr && fr.img ? `<img src="${fr.img}" alt="" style="width:${F}px;height:${F}px">` : ''}</span>`;
}
function previewOf(it) {
  if (it.cat === 'char') return `<img class="pv" src="${charImg(it.id, 'bust')}" alt="" style="object-fit:cover;padding:0">`;
  if (it.img) return `<img class="pv pvi" src="${it.img}" alt="">`;
  if (it.cat === 'pet' || it.cat === 'use') return `<div class="pv">${it.e}</div>`;
  if (it.cat === 'aura') return `<div class="pv" style="background:radial-gradient(${it.c},transparent 75%)">✨</div>`;
  if (it.cat === 'frame') return `<div class="pv" style="background:${it.css}"></div>`;
  return `<div class="pv" style="font-size:20px">称</div>`;
}
function vHeroChar() {
  const ri = realmInfo(S.xp), h = S.hero, cm = META.find(m => m.id === (h.char || 'kiem')) || {};
  const ti = itemOf(S.equip.title || 'tt_0');
  const list = ITEMS.filter(i => i.cat === shopCat).sort((a, b) => a.price - b.price);
  const roadmap = REALMS.concat([{ n: 'Phi Thăng', h: '飞升', p: 'fēishēng' }]).map((r, i) => {
    const cur = i === ri.ri, done = i < ri.ri;
    return `<div class="realm ${cur ? 'cur' : ''}"><span>${done ? '✓' : cur ? '▶' : '·'}</span><span style="font-size:20px;width:70px;font-family:'Microsoft YaHei',sans-serif">${r.h}</span><span style="flex:1">${r.n} <span class="mut">${r.p}</span></span><span class="mut">${i < REALMS.length ? 'HSK' + r.hsk + ' · ' + r.c * 9 + ' tu vi' : ''}</span></div>`;
  }).join('');
  view.innerHTML = `
  <div class="card">${heroCard(270)}
    <h3 style="margin:14px 0 0" id="hname">${esc(h.name)}</h3>
    <div class="mut">${ti ? ti.h + ' · ' + ti.name : ''}</div>
    <div class="mut">${esc(cm.name || '')} · ${esc(cm.kind || '')} · Hệ ${gElLabel(h.char || 'kiem')}</div>
    ${GCOS_ST.map(c => itemOf(S.equip[c])).filter(it => it && it.st).map(it => `<div class="mut">${{ frame: '🖼️', aura: '✨', pet: '🐾' }[it.cat]} ${esc(it.name)}: <b style="color:var(--ac2)">${petStTxt(it)}</b></div>`).join('')}
    <div class="pin" style="font-size:20px;margin-top:6px">${ri.h} ${ri.name}</div>
    <div class="bar g"><i style="width:${ri.into / ri.need * 100}%"></i></div>
    <div class="mut">Tu vi ${ri.max ? 'tối đa' : ri.into + ' / ' + ri.need} · hôm nay ${S.xpDay === today() ? S.xpToday : 0}${GCFG.xpDayLimit ? '/' + GCFG.xpDayCap : ''} · tổng ${S.xp} · 💎 ${S.ls} linh thạch · 🧿 ${S.freezes} Hộ Chuỗi Phù</div></div>
  <div class="card" style="text-align:left"><b>Đạo hiệu</b>
    <input id="nm" maxlength="16" value="${esc(h.name)}" placeholder="Đạo hiệu của bạn"></div>
  <h3 style="margin:14px 0 4px;text-align:left">🏮 Phường thị <span class="mut" style="font-size:14px">(💎 ${S.ls})</span></h3>
  <div class="pills" id="cats">${CATS.map(([k, n]) => `<button data-cat="${k}" class="${shopCat === k ? 'on' : ''}">${n}</button>`).join('')}</div>
  ${list.map(it => {
    const own = owned(it), on = isOn(it), use = it.cat === 'use', can = S.ls >= it.price;
    const btn = use ? `<button class="buy" data-buy="${it.id}" ${can ? '' : 'disabled'}>Mua 💎${it.price}</button>`
      : own ? (on ? (single(it.cat) ? '<button disabled>Đang dùng</button>' : `<button data-unequip="${it.cat}">Gỡ</button>`) : `<button class="use" data-equip="${it.id}">${single(it.cat) ? 'Chọn' : 'Trang bị'}</button>`)
      : `<button class="buy" data-buy="${it.id}" ${can ? '' : 'disabled'}>Mua 💎${it.price}</button>`;
    const sub = use ? esc(it.d) : it.cat === 'char' ? esc(it.kind + ' · ' + it.skill) + ' · Hệ ' + gElLabel(it.id) : it.cat === 'title' ? it.h + ' ' + it.p : (own ? 'Đã sở hữu' : it.price + ' linh thạch') + (it.st ? ' · <b style="color:var(--ac2)">' + petStTxt(it) + '</b>' : '');
    return `<div class="item">${previewOf(it)}<div class="nm"><b>${esc(it.name)}</b>${on ? ' <span class="ok-t">• đang dùng</span>' : ''}<small>${sub}${!use && own && it.price > 0 && (it.cat === 'char' || it.cat === 'title') ? ' · đã sở hữu' : ''}</small></div>${btn}</div>`;
  }).join('')}
  <h3 style="margin:16px 0 4px;text-align:left">Cảnh giới tu tiên</h3><div class="card" style="padding:6px 10px">${roadmap}</div>
  <p class="mut" style="text-align:left">Kiếm tu vi và linh thạch (💎 nhân hệ số theo cảnh giới, càng lên cao càng nhiều): mỗi câu đúng +10 tu vi +${lsGain(1)} 💎 · qua bài lần đầu +20 tu vi +${lsGain(10)} 💎 · hoàn hảo lần đầu thêm +30 tu vi +${lsGain(25)} 💎 · đạt mục tiêu ngày +${lsGain(10)} 💎 · mở rương truyện +${lsGain(20)} 💎. Mỗi cảnh giới gắn với một trình độ HSK, muốn sang cảnh giới mới phải qua bài test HSK (độ kiếp).</p>`;
  $('#nm').oninput = e => { h.name = e.target.value.slice(0, 16) || 'Đạo hữu'; $('#hname').textContent = h.name; save(); };
  view.onclick = e => {
    const q = a => e.target.closest('[' + a + ']'); let b;
    if ((b = q('data-cat'))) { shopCat = b.dataset.cat; return vHero(); }
    if ((b = q('data-equip'))) {
      const it = itemOf(b.dataset.equip);
      if (it.cat === 'char') h.char = it.id; else S.equip[it.cat] = it.id;
      save(); return vHero();
    }
    if ((b = q('data-unequip'))) { delete S.equip[b.dataset.unequip]; save(); return vHero(); }
    if ((b = q('data-buy'))) { buyItem(b.dataset.buy); }
  };
}
function buyItem(id) {
  const it = itemOf(id);
  if (S.ls < it.price) return toast('Không đủ linh thạch 💎');
  if (it.kind === 'charm') {
    if (S.freezes >= 2) return toast('Chỉ giữ tối đa 2 Hộ Chuỗi Phù.');
    S.ls -= it.price; S.freezes++; save(); header(); vHero(); return toast('🧿 Đã mua Hộ Chuỗi Phù');
  }
  S.ls -= it.price;
  if (it.kind === 'pill') {
    const d2 = today(); if (S.pillDay !== d2) { S.pillDay = d2; S.pillN = 0; }
    const why = (S.log[d2] || 0) < GOAL ? 'Hãy đạt mục tiêu ngày (' + GOAL + ' câu) trước khi dùng đan dược.' : S.pillN >= GCFG.pillsPerDay ? 'Mỗi ngày chỉ dùng tối đa ' + GCFG.pillsPerDay + ' viên đan dược.' : gXpRoom() <= 0 ? 'Hôm nay đã đạt giới hạn tu vi, không cần dùng đan dược.' : '';
    if (why) { S.ls += it.price; return toast(why); }
    S.pillN++; save(); addXP(it.xp); vHero(); return;
  }
  S.inv[id] = true;
  if (it.cat === 'char') S.hero.char = id; else S.equip[it.cat] = id;
  save(); header(); vHero(); toast('Đã mua và chọn ' + it.name);
}

if ('speechSynthesis' in window) speechSynthesis.getVoices();
rpgInit();
applyFreeze();
render();
if (S.refunded) { toast('Đã hoàn ' + S.refunded + ' 💎 cho đồ trang phục cũ, hãy dùng để mua nhân vật mới!'); S.refunded = 0; save(); }
